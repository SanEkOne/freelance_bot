name: freelance-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freelance-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run bot once
        run: python freelance_bot/freelance_bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FH_TOKEN: ${{ secrets.FH_TOKEN }}

      - name: Save seen projects
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_projects.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
